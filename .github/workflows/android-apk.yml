name: Android APK

on:
  push:
    branches:
      - android-apk-v1
    paths-ignore:
      - ANDROID_BUILD_LAST.log
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle :android-app:assembleDebug --stacktrace 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          tail -n 260 android-build.log > ANDROID_BUILD_LAST.log
          exit "$status"

      - name: Commit build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ANDROID_BUILD_LAST.log
          git commit -m "Record Android build failure log" || true
          git push || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: at-ai-mobil-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
